[project]
name = "ai-engineer-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Aravinds2511", email = "aravindvasang@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.4",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.50",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-engineer-project = "ai_engineer_project:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
